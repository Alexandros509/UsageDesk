[project]
name = "usagedesk"
version = "0.1.0a16"
description = "Independent Windows tray launcher and usage monitor foundation"
requires-python = ">=3.13,<3.14"
dependencies = ["PySide6-Essentials>=6.8,<7", "httpx>=0.28,<1", "pywin32>=310; sys_platform == 'win32'"]

[project.gui-scripts]
usagedesk = "usagedesk.app:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "pyinstaller>=6,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
